}

left:0;

.timeline {
list-style-type: none;
display: flex;
align-items: center;
margin-left: -12%;
}
.li {
width: 13%;
}
.timestamp {
margin-bottom: 20px;
padding: 0px 40px;
display: flex;
flex-direction: column;
align-items: center;
font-weight: 100;
}
.status {
border-top: 2px solid #ced7df;
position: relative;
}
.status:before {
content: "";
width: 18px;
height: 18px;
background-color: #f6f8f9;
border-radius: 25px;
border: 1px solid #ddd;
position: relative;
top: -11px;
float: right;
}
.li.complete .status {
border-top: 2px solid #3575D3;
}
.li.complete .status:before {
background-color: #3575D3;
border: none;
}
.li.complete .status h6 {
color: #666;
font-weight: bold;
text-transform: capitalize;
}
.bar {
width: 32%;
}
.complete-step {
border-top: 2px solid #3575D3;
position: relative;
}
.incomplete-step {
border-top: 2px solid #ced7df;
position: relative;
}
.no-status .step-name>h6 {
text-indent: 100%;
white-space: nowrap;
overflow: hidden;
}
.pagination-container {
padding-top: 1%;
}
.step-name {
float: right;
margin-right: -17%;
}
.timeline h6 {
color: #666;
text-transform: capitalize;
width: 100%;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.pagination-gradient {
height: 2.9%;
width: 100%;
position: absolute;
top: 4%;
background-color: #f6f8f9;
left: 0%;
}
@media (min-device-width: 320px) and (max-device-width: 1085px) {
.bar {
width: 29%;
}
.pagination-gradient {
display: none;
}
